<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <div class="brand">
            <img src="icon.png" alt="Aegis">
            Aegis Vault
        </div>
        <div class="actions">
            <button id="qrScanBtn" title="Scan QR Code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                    <path d="M3 14h7v7H3z" />
                </svg>
            </button>
            <button id="refreshBtn" title="Refresh">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                </svg>
            </button>
            <button id="openAppBtn" title="Open Desktop App">
                <svg viewBox="0 0 24 24">
                    <path d="M19 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 14H5V8h14v10z" />
                </svg>
            </button>
        </div>
    </div>

    <div class="search-area">
        <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            <input type="text" id="searchInput" placeholder="Search logins..." autocomplete="off">
        </div>
    </div>

    <div class="list-container" id="listContainer">
        <!-- Results will be injected here -->
        <div class="empty-state">
            <svg fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-8 8 3.59 8 8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" />
            </svg>
            <div class="empty-text">Searching vault...</div>
        </div>
    </div>

    <!-- Hidden file input for QR upload -->
    <input type="file" id="qrFileInput" accept="image/*" style="display: none;" />

    <!-- QR Scan Modal -->
    <div id="qrModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Scan QR Code</div>
                <button class="modal-close" id="qrModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="qr-upload-area" id="qrUploadArea">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="qr-icon">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <path d="M3 14h7v7H3z" />
                    </svg>
                    <div class="qr-text">Click to upload QR code image</div>
                    <div class="qr-subtext">The QR code will be scanned and sent to the desktop app</div>
                </div>
                <div id="qrResult" class="qr-result" style="display: none;"></div>
            </div>
        </div>
    </div>


    <script src="jsQR.js"></script>
    <script src="popup.js"></script>
</body>

</html>
