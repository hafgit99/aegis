<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 340px;
            height: 450px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header: Logo + Actions */
        .header {
            padding: 12px 16px;
            background: #1e293b;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #334155;
            height: 48px;
            box-sizing: border-box;
        }

        .brand {
            flex: 1;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            color: #fff;
        }

        .brand img {
            width: 22px;
            height: 22px;
            margin-right: 8px;
        }

        .actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .actions button:hover {
            background: #334155;
            color: #fff;
        }

        .actions svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Search Bar */
        .search-area {
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
        }

        .search-input-wrap {
            position: relative;
        }

        .search-input-wrap svg {
            position: absolute;
            left: 10px;
            top: 9px;
            width: 16px;
            height: 16px;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 8px 10px 8px 34px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* Login List */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 16px 16px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin: 16px 0 8px 0;
            font-weight: 600;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: transform 0.1s, border-color 0.2s;
        }

        .card:hover {
            border-color: #475569;
            background: #253045;
        }

        .card:active {
            transform: scale(0.99);
        }

        .card-icon {
            width: 36px;
            height: 36px;
            background: #334155;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #f8fafc;
            font-size: 16px;
            margin-right: 12px;
        }

        .card-info {
            flex: 1;
            overflow: hidden;
        }

        .card-title {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .card-sub {
            font-size: 12px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            margin-top: 60px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 13px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="brand">
            <img src="icon.png" alt="Aegis">
            Aegis Vault
        </div>
        <div class="actions">
            <button id="qrScanBtn" title="Scan QR Code">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                    <path d="M3 14h7v7H3z" />
                </svg>
            </button>
            <button id="refreshBtn" title="Refresh">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                </svg>
            </button>
            <button id="openAppBtn" title="Open Desktop App">
                <svg viewBox="0 0 24 24">
                    <path d="M19 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 14H5V8h14v10z" />
                </svg>
            </button>
        </div>
    </div>

    <div class="search-area">
        <div class="search-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            <input type="text" id="searchInput" placeholder="Search logins..." autocomplete="off">
        </div>
    </div>

    <div class="list-container" id="listContainer">
        <!-- Results will be injected here -->
        <div class="empty-state">
            <svg fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-8 8 3.59 8 8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" />
            </svg>
            <div class="empty-text">Searching vault...</div>
        </div>
    </div>

    <!-- Hidden file input for QR upload -->
    <input type="file" id="qrFileInput" accept="image/*" style="display: none;" />

    <!-- QR Scan Modal -->
    <div id="qrModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Scan QR Code</div>
                <button class="modal-close" id="qrModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="qr-upload-area" id="qrUploadArea">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="qr-icon">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <path d="M3 14h7v7H3z" />
                    </svg>
                    <div class="qr-text">Click to upload QR code image</div>
                    <div class="qr-subtext">The QR code will be scanned and sent to the desktop app</div>
                </div>
                <div id="qrResult" class="qr-result" style="display: none;"></div>
            </div>
        </div>
    </div>

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #334155;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #334155;
        }

        .modal-title {
            font-weight: 600;
            font-size: 16px;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .modal-close:hover {
            background: #334155;
            color: #fff;
        }

        .modal-body {
            padding: 16px;
        }

        .qr-upload-area {
            border: 2px dashed #334155;
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qr-upload-area:hover {
            border-color: #10b981;
            background: #10b98110;
        }

        .qr-icon {
            width: 48px;
            height: 48px;
            color: #10b981;
            margin: 0 auto 16px;
        }

        .qr-text {
            font-size: 14px;
            color: #fff;
            margin-bottom: 8px;
        }

        .qr-subtext {
            font-size: 12px;
            color: #64748b;
        }

        .qr-result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
        }

        .qr-result.success {
            background: #10b98120;
            border: 1px solid #10b981;
            color: #10b981;
        }

        .qr-result.error {
            background: #ef444420;
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .qr-result.info {
            background: #3b82f620;
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }
    </style>

    <script src="popup.js"></script>
</body>

</html>
