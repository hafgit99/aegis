name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Build macOS App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Vault-macOS-Arm64
          path: |
            dist_out/*.dmg
            dist_out/*.zip
          retention-days: 5
